<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="topbar" class="topbar">
    <h1><a th:href="@{/home}">Crop Advisory Portal</a></h1>
    <nav>
        <a th:href="@{/records}" id="nav-records">Records</a>
        <a th:href="@{/records/new}" id="nav-new" sec:authorize="hasRole('FARMER')">New query</a>
    </nav>
    <form th:action="@{/logout}" method="post">
        <span class="user" sec:authentication="name">user</span>
        <button type="submit" id="logout-button">Sign out</button>
    </form>
</header>
</body>
</html>
