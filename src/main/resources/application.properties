spring.application.name=crop-advisory-portal

# Port used by "mvn spring-boot:run" (Jenkins 8080, Tomcat 8081, Docker host 8082 are taken)
server.port=${APP_PORT:8083}

# Environment label shown on the home page (parameter for the pipeline)
app.env=${APP_ENV:dev}

# H2 in file mode. Override the location with DB_PATH
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/cropdb}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Only the health endpoint is exposed
management.endpoints.web.exposure.include=health
