---
- name: Inspect currently active release link
  ansible.builtin.stat:
    path: "/opt/{{ app_name }}/current"
    follow: false
  register: active_release_link

- name: Record previous release path for automatic rollback
  ansible.builtin.set_fact:
    previous_release_path: "{{ active_release_link.stat.lnk_source | default('') }}"
    previous_release_version: "{{ active_release_link.stat.lnk_source | default('') | basename }}"

- name: Verify the previous link is a managed release
  ansible.builtin.assert:
    that:
      - previous_release_path | length == 0 or previous_release_path is match('^' ~ app_releases_dir ~ '/[^/]+$')
    fail_msg: "The current symlink does not point to a versioned application release; refusing deployment."

- name: Calculate candidate WAR checksum on the Ansible controller
  ansible.builtin.stat:
    path: "{{ war_path }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: candidate_war
  run_once: true

- name: Inspect WAR currently active in the previous release
  ansible.builtin.stat:
    path: "{{ previous_release_path }}/app.war"
    checksum_algorithm: sha256
  register: previous_release_war
  when: previous_release_path | length > 0

- name: Prevent replacing the active release with different content
  ansible.builtin.assert:
    that:
      - previous_release_path != app_release_dir or previous_release_war.stat.checksum == candidate_war.stat.checksum
    fail_msg: >-
      Release {{ app_version }} is currently active and release directories are immutable.
      Choose a new app_version for changed WAR content so automatic rollback can restore the prior artifact.
  when: previous_release_path == app_release_dir

- name: Deploy versioned WAR and roll back automatically if health fails
  block:
    - name: Create versioned release directory
      ansible.builtin.file:
        path: "{{ app_release_dir }}"
        state: directory
        owner: cropapp
        group: cropapp
        mode: "0755"

    - name: Copy WAR from the Ansible controller
      ansible.builtin.copy:
        src: "{{ war_path }}"
        dest: "{{ app_release_dir }}/app.war"
        owner: cropapp
        group: cropapp
        mode: "0644"
      register: deployed_war

    - name: Switch current symlink to the new release
      ansible.builtin.file:
        src: "{{ app_release_dir }}"
        dest: "/opt/{{ app_name }}/current"
        state: link
        force: true
      register: release_link

    - name: Enable service and restart only when release or configuration changed
      ansible.builtin.systemd:
        name: crop-advisory.service
        enabled: true
        state: "{{ 'restarted' if (deployed_war.changed or release_link.changed or service_config_changed | default(false)) else 'started' }}"
        daemon_reload: true
      when: not ansible_check_mode

    - name: Wait for application health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/actuator/health"
        method: GET
        status_code: 200
        return_content: true
        follow_redirects: none
      register: deployment_health
      until:
        - deployment_health.status | default(0) == 200
        - deployment_health.json.status | default('') == 'UP'
      retries: 10
      delay: 5
      when: not ansible_check_mode

    - name: Prune old releases after successful deployment
      ansible.builtin.include_tasks: prune.yml
      when: not ansible_check_mode

  rescue:
    - name: Report health failure and start automatic rollback
      ansible.builtin.debug:
        msg: >-
          Release {{ app_version }} failed deployment or health verification.
          Restoring {{ previous_release_version if previous_release_path | length > 0 else 'no prior release' }}.

    - name: Restore the previous release symlink
      ansible.builtin.file:
        src: "{{ previous_release_path }}"
        dest: "/opt/{{ app_name }}/current"
        state: link
        force: true
      when: previous_release_path | length > 0

    - name: Remove current symlink when there is no previous release
      ansible.builtin.file:
        path: "/opt/{{ app_name }}/current"
        state: absent
      when: previous_release_path | length == 0

    - name: Restart previous release or stop service when no release exists
      ansible.builtin.systemd:
        name: crop-advisory.service
        state: "{{ 'restarted' if previous_release_path | length > 0 else 'stopped' }}"
        daemon_reload: true
      when: not ansible_check_mode

    - name: Verify restored release health
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/actuator/health"
        method: GET
        status_code: 200
        return_content: true
        follow_redirects: none
      register: rollback_health
      until:
        - rollback_health.status | default(0) == 200
        - rollback_health.json.status | default('') == 'UP'
      retries: 10
      delay: 5
      when:
        - not ansible_check_mode
        - previous_release_path | length > 0

    - name: Remove failed release after restoring the previous version
      ansible.builtin.file:
        path: "{{ app_release_dir }}"
        state: absent
      when: app_release_dir != previous_release_path

    - name: Fail clearly after restoring the previous release
      ansible.builtin.fail:
        msg: >-
          Deployment of {{ app_version }} failed health verification.
          Automatically rolled back to {{ previous_release_version }};
          the previous release passed its health check.
      when:
        - not ansible_check_mode
        - previous_release_path | length > 0
        - rollback_health.status | default(0) == 200
        - rollback_health.json.status | default('') == 'UP'

    - name: Fail clearly when the first release has no rollback target
      ansible.builtin.fail:
        msg: >-
          Deployment of {{ app_version }} failed and no previous release exists.
          The current symlink was removed and crop-advisory.service was stopped.
      when:
        - not ansible_check_mode
        - previous_release_path | length == 0

    - name: Report that deployment failed during check mode
      ansible.builtin.fail:
        msg: "Deployment checks failed; check mode did not modify the target or attempt runtime rollback."
      when: ansible_check_mode
