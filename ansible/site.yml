---
- name: Configure Crop Advisory Portal
  hosts: crop_servers
  become: true
  gather_facts: true

  vars:
    app_release_dir: "{{ app_releases_dir }}/{{ app_version }}"

  pre_tasks:
    - name: Check that the built WAR is available on the control node
      ansible.builtin.stat:
        path: "{{ war_path }}"
      delegate_to: localhost
      become: false
      register: built_war
      run_once: true

    - name: Require the built WAR before changing the target
      ansible.builtin.assert:
        that:
          - built_war.stat.exists
          - built_war.stat.isreg
        fail_msg: "Set war_path to an existing WAR on the Ansible control node."
      delegate_to: localhost
      become: false
      run_once: true

    - name: Validate deployment settings
      ansible.builtin.assert:
        that:
          - app_version is match('^[A-Za-z0-9][A-Za-z0-9._+-]*$')
          - app_port | int >= 1
          - app_port | int <= 65535
          - app_release_limit | int >= 1
        fail_msg: "Set a safe app_version and a valid app_port in group_vars/all.yml."

  tasks:
    - name: Install Java 17 runtime and curl
      ansible.builtin.apt:
        name:
          - openjdk-17-jre-headless
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create cropapp system group
      ansible.builtin.group:
        name: cropapp
        system: true
        state: present

    - name: Create cropapp system user
      ansible.builtin.user:
        name: cropapp
        group: cropapp
        system: true
        create_home: false
        shell: /usr/sbin/nologin
        state: present

    - name: Create application root directory
      ansible.builtin.file:
        path: "/opt/{{ app_name }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create application releases directory
      ansible.builtin.file:
        path: "{{ app_releases_dir }}"
        state: directory
        owner: cropapp
        group: cropapp
        mode: "0755"

    - name: Create application data directory
      ansible.builtin.file:
        path: "{{ app_data_dir }}"
        state: directory
        owner: cropapp
        group: cropapp
        mode: "0750"

    - name: Create application configuration directory
      ansible.builtin.file:
        path: "{{ app_config_dir }}"
        state: directory
        owner: root
        group: cropapp
        mode: "0750"

    - name: Template application environment
      ansible.builtin.template:
        src: templates/crop-advisory.env.j2
        dest: "{{ app_config_dir }}/crop-advisory.env"
        owner: root
        group: cropapp
        mode: "0640"
      register: app_environment_config

    - name: Template systemd service unit
      ansible.builtin.template:
        src: templates/crop-advisory.service.j2
        dest: /etc/systemd/system/crop-advisory.service
        owner: root
        group: root
        mode: "0644"
      register: app_service_config

    - name: Record whether service configuration changed
      ansible.builtin.set_fact:
        service_config_changed: "{{ app_environment_config.changed or app_service_config.changed }}"

    - name: Check whether UFW is installed
      ansible.builtin.stat:
        path: /usr/sbin/ufw
      register: ufw_binary

    - name: Read UFW status when installed
      ansible.builtin.command:
        argv:
          - /usr/sbin/ufw
          - status
      register: ufw_status
      changed_when: false
      when: ufw_binary.stat.exists

    - name: Allow application traffic through active UFW
      ansible.builtin.command:
        argv:
          - /usr/sbin/ufw
          - allow
          - "{{ app_port }}/tcp"
      register: ufw_allow
      changed_when: >-
        'Rule added' in (ufw_allow.stdout + ufw_allow.stderr) or
        'Rules updated' in (ufw_allow.stdout + ufw_allow.stderr)
      when:
        - ufw_binary.stat.exists
        - "'Status: active' in ufw_status.stdout"

    - name: Deploy application release and verify health
      ansible.builtin.include_role:
        name: deploy
